<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><link rel="stylesheet" href="/static/style.css"></head><body><header><strong>Python Tool Panel</strong><form method="post" action="/logout"><button>Logout</button></form></header><main class="container"><h1>Tools</h1><div class="grid">{% for tool in tools %}<a class="tool" href="/tool/{{tool}}"><strong>{{tool}}</strong><span>{{states.get(tool,"stopped")}}</span></a>{% else %}<p>No Python tools installed.</p>{% endfor %}</div></main></body></html>
