services:
  panel:
    build: .
    restart: unless-stopped
    ports: ["8000:8000"]
    env_file: [.env]
    volumes:
      - ./tools:/srv/app/tools:ro
      - ./logs:/srv/app/logs
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
